<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Notification Service Demo</title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 1.5rem;
      }
      label {
        display: block;
        margin: 0.5rem 0;
      }
      input {
        padding: 0.25rem 0.5rem;
        min-width: 280px;
      }
      button {
        margin-top: 0.5rem;
        padding: 0.4rem 0.8rem;
      }
      pre {
        background: #111827;
        color: #e5e7eb;
        padding: 0.75rem;
        border-radius: 0.25rem;
        max-height: 300px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <h1>Notification Service Demo</h1>

    <section>
      <h2>1. Connect as a user</h2>
      <label>
        User ID:
        <input id="userId" placeholder="Enter userId used by backend" />
      </label>
      <button id="connectBtn">Connect via Socket.IO</button>
      <p id="status">Disconnected</p>
    </section>

    <section>
      <h2>2. Live notifications (notifications:updated)</h2>
      <pre id="log">Waiting for events...</pre>
    </section>

    <section>
      <h2>3. List notifications via Socket.IO</h2>
      <button id="listBtn" disabled>List notifications for this user</button>
      <pre id="listLog">No list yet.</pre>
    </section>

    <section>
      <h2>4. Mark a notification as read (Socket.IO)</h2>
      <label>
        Notification ID to mark as read:
        <input id="notifId" placeholder="Paste a notification _id here" />
      </label>
      <button id="markReadBtn" disabled>Mark as read</button>
    </section>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script>
      const statusEl = document.getElementById("status");
      const logEl = document.getElementById("log");
      const listLogEl = document.getElementById("listLog");
      const userIdInput = document.getElementById("userId");
      const notifIdInput = document.getElementById("notifId");
      const connectBtn = document.getElementById("connectBtn");
      const listBtn = document.getElementById("listBtn");
      const markReadBtn = document.getElementById("markReadBtn");

      let socket = null;
      let currentUserId = null;

      connectBtn.addEventListener("click", () => {
        const userId = userIdInput.value.trim();
        if (!userId) {
          alert("Please enter a userId (must match what backend uses).");
          return;
        }

        // Clean up previous connection if any
        if (socket) {
          socket.disconnect();
          socket = null;
        }

        currentUserId = userId;

        socket = io("http://localhost:4002", {
          // This is read in handleNotificationSocketConnection as socket.auth.userId
          auth: { userId },
        });

        statusEl.textContent = "Connecting...";
        logEl.textContent = "Waiting for events...";
        listLogEl.textContent = "No list yet.";

        socket.on("connect", () => {
          statusEl.textContent = `Connected: ${socket.id} (user ${userId})`;
          listBtn.disabled = false;
          markReadBtn.disabled = false;
        });

        socket.on("disconnect", () => {
          statusEl.textContent = "Disconnected";
          listBtn.disabled = true;
          markReadBtn.disabled = true;
        });

        socket.on("notifications:updated", (notif) => {
          if (logEl.textContent === "Waiting for events...") {
            logEl.textContent = "";
          }
          logEl.textContent += "\n" + JSON.stringify(notif, null, 2);
        });

        socket.on("notifications:list:result", (result) => {
          listLogEl.textContent = JSON.stringify(result, null, 2);
        });
      });

      listBtn.addEventListener("click", () => {
        if (!socket || !currentUserId) return;
        socket.emit("notifications:list", {
          userId: currentUserId,
          query: { limit: 20 },
        });
      });

      markReadBtn.addEventListener("click", () => {
        if (!socket || !currentUserId) return;
        const notificationId = notifIdInput.value.trim();
        if (!notificationId) {
          alert("Please enter a notification ID to mark as read.");
          return;
        }

        socket.emit("notifications:markRead", {
          notificationId,
          userId: currentUserId,
        });
      });
    </script>
  </body>
</html>
