<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Message Service Socket.IO Test</title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 1.5rem;
      }
      label {
        display: block;
        margin: 0.5rem 0;
      }
      input {
        padding: 0.25rem 0.5rem;
        min-width: 280px;
      }
      button {
        margin-top: 0.5rem;
        padding: 0.4rem 0.8rem;
      }
      pre {
        background: #111827;
        color: #e5e7eb;
        padding: 0.75rem;
        border-radius: 0.25rem;
        max-height: 300px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <h1>Message Service Socket.IO Test</h1>

    <section>
      <h2>1. Connect and join a room</h2>
      <label>
        User ID / Name:
        <input id="userId" placeholder="Enter user identifier" />
      </label>
      <label>
        Room ID:
        <input id="roomId" placeholder="Enter roomId" />
      </label>
      <button id="connectBtn">Connect & Join Room</button>
      <p id="status">Disconnected</p>
    </section>

    <section>
      <h2>2. Send a message</h2>
      <label>
        Message text:
        <input id="messageText" placeholder="Type a message" />
      </label>
      <button id="sendBtn" disabled>Send message</button>
    </section>

    <section>
      <h2>3. Incoming messages ("message" event)</h2>
      <pre id="log">Waiting for messages...</pre>
    </section>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script>
      const statusEl = document.getElementById("status");
      const logEl = document.getElementById("log");
      const userIdInput = document.getElementById("userId");
      const roomIdInput = document.getElementById("roomId");
      const messageTextInput = document.getElementById("messageText");
      const connectBtn = document.getElementById("connectBtn");
      const sendBtn = document.getElementById("sendBtn");

      let socket = null;
      let currentUserId = null;
      let currentRoomId = null;

      function appendLog(line) {
        if (logEl.textContent === "Waiting for messages...") {
          logEl.textContent = "";
        }
        logEl.textContent += "\n" + line;
        logEl.scrollTop = logEl.scrollHeight;
      }

      connectBtn.addEventListener("click", () => {
        const userId = userIdInput.value.trim();
        const roomId = roomIdInput.value.trim();

        if (!userId) {
          alert("Please enter a user identifier");
          return;
        }
        if (!roomId) {
          alert("Please enter a roomId");
          return;
        }

        // Clean up previous connection if any
        if (socket) {
          socket.disconnect();
          socket = null;
        }

        currentUserId = userId;
        currentRoomId = roomId;

        // Message service Socket.IO endpoint (port 4001 by default)
        socket = io("http://localhost:4001");

        statusEl.textContent = "Connecting...";
        logEl.textContent = "Waiting for messages...";
        sendBtn.disabled = true;

        socket.on("connect", () => {
          statusEl.textContent = `Connected: ${socket.id} (user ${userId}, room ${roomId})`;

          // Join the specified room (matches server-side 'join' handler)
          socket.emit("join", { name: userId, roomId });

          sendBtn.disabled = false;
        });

        socket.on("disconnect", () => {
          statusEl.textContent = "Disconnected";
          sendBtn.disabled = true;
        });

        // Listen for broadcasted messages from the room
        socket.on("message", (message) => {
          appendLog(JSON.stringify(message, null, 2));
        });

        socket.on("connect_error", (err) => {
          statusEl.textContent = "Connect error: " + err.message;
          appendLog("Connect error: " + err.message);
        });
      });

      sendBtn.addEventListener("click", () => {
        if (!socket || !currentUserId || !currentRoomId) return;

        const text = messageTextInput.value.trim();
        if (!text) {
          alert("Please enter a message");
          return;
        }

        // Matches server-side 'message' handler signature
        socket.emit("message", {
          roomId: currentRoomId,
          senderId: currentUserId,
          text,
        });

        messageTextInput.value = "";
      });
    </script>
  </body>
</html>
